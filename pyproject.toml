[project]
name = "ai_stock_picker_agent"
version = "0.1.0"
description = "ai-stock-picker-agent using crewAI and LangChain"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<3.13" 
dependencies = [
    "crewai>=0.108.0",
    "crewai-tools[rag]>=0.12.1",  # Separate from core to avoid embedchain conflicts
    "langchain-openai>=0.3.0",
    "langchain>=0.3.0",
    "yfinance>=0.2.50",
    "pydantic>=2.0.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.0.1",
    "chromadb>=1.1.1",
]

[project.scripts]
ai_stock_picker_agent = "ai_stock_picker_agent.main:run"
run_crew = "ai_stock_picker_agent.main:run"
train = "ai_stock_picker_agent.main:train"
replay = "ai_stock_picker_agent.main:replay"
test = "ai_stock_picker_agent.main:test"
run_with_trigger = "ai_stock_picker_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
