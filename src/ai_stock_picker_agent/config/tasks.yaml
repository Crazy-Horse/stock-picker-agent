find_trending_companies:
  description: >
    Find 3-5 publicly traded companies trending in the news for {sector}.
    Use the latest sources (last 7 days) and include tickers.
    Output JSON list with name, ticker, reason, and sources.
  expected_output: >
    JSON list of companies with sources.
  agent: trending_company_finder

research_trending_companies:
  description: >
    For each company identified, perform the following logical steps:
    1. SEARCH: Query 'internal_research_search' for transcripts. Extract qualitative 'moat' signals.
    2. QUANT: Use 'get_fundamentals' for {tickers}. If metrics are unavailable, state 'DATA_MISSING'.
    3. SYNTHESIS: Compare internal signals against recent web news via 'SerperDevTool'.
    4. CITATION: Map every claim to a specific source file or URL.
  expected_output: >
    A validated TrendingCompanyResearch object with zero hallucinations and explicit citations.
  agent: financial_researcher
  context:
    - find_trending_companies

score_candidates:
  description: >
    Evaluate the research report. Assign a 'confidence_score' from 0-1.
    A score below 0.7 indicates insufficient evidence from internal docs.
  expected_output: >
    A scoring object used to determine if the workflow proceeds to 'pick_best_company' 
    or returns to 'research_trending_companies' for more data.
  agent: stock_picker
  context:
    - research_trending_companies

pick_best_company:
  description: >
    Select the best investment idea using the rubric scores + research.
    Output a decision memo:
    - Winner and 3-sentence thesis
    - Assumptions + uncertainty
    - Top risks and invalidation signals
    - Why each other candidate was rejected
    - Sources cited (dated)
  expected_output: >
    Markdown decision memo.
  agent: stock_picker
  context:
    - score_candidates
  output_file: output/decision.md
